<section class="bg-white border border-gray-200 rounded-lg shadow-md p-6 max-w-xl mx-auto"><h2 class="text-xl font-bold text-gray-800 mb-6">Agregar maestro</h2><form [formGroup]="formulario" (ngSubmit)="guardar()" class="space-y-4"><input formControlName="id_maestro" type="number" placeholder="ID maestro" class="w-full p-2.5 border rounded-lg" /><input formControlName="nombre" placeholder="Nombre" class="w-full p-2.5 border rounded-lg" /><input formControlName="apaterno" placeholder="Apellido paterno" class="w-full p-2.5 border rounded-lg" /><input formControlName="amaterno" placeholder="Apellido materno" class="w-full p-2.5 border rounded-lg" /><input formControlName="correo" type="email" placeholder="Correo" class="w-full p-2.5 border rounded-lg" /><p *ngIf="mensajeError" class="text-sm text-red-600">{{ mensajeError }}</p><div class="flex gap-3"><button type="submit" [disabled]="guardando" class="text-white bg-blue-700 font-medium rounded-lg px-5 py-2.5">{{ guardando ? 'Registrando...' : 'Registrar maestro' }}</button><a routerLink="/utl/maestros" class="px-5 py-2.5 border rounded-lg">Cancelar</a></div></form></section>
